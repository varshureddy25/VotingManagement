<!DOCTYPE html>
<html>
<head>
    <title>Survey</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<form class="form-box">

<h2>Society Survey</h2>

<label>Cleanliness Satisfaction</label>
<br><br>

<input type="radio" name="clean"> Excellent
<input type="radio" name="clean"> Good
<input type="radio" name="clean"> Poor

<br><br>

<label>Parking Issues</label>
<br><br>

<input type="checkbox"> Limited Parking
<input type="checkbox"> Visitor Parking Issue

<br><br>

<label>Maintenance Quality</label>

<select>
    <option>Excellent</option>
    <option>Good</option>
    <option>Average</option>
</select>

<textarea placeholder="Suggestions"></textarea>

<button class="btn">Submit Survey</button>

</form>

</body>
</html>
